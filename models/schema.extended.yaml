      type: string
      required: false
      description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
        a simple multi-line comment) describing this component.
    - name: Tier
      type: integer
      required: false
      description: The tier level of this component.
  Experiment:
    description: This element describes the experiment during which this Image was acquired. The optional Description element
      may contain free text to further describe the experiment.
    fields:
    - name: Name
      type: string
      required: false
      description: A user assigned name for this Experiment.
    - name: ID
      type: string
      required: true
      description: A unique identifier for this Experiment.
      is_identifier: true
    - name: Purpose
      type: string
      required: true
      description: This field records a term used the general purpose of the imaging experiment performed in this case.
      constraints:
        enum:
        - Co-localization
        - Electrophysiology
        - Fluorescent Speckle Microscopy (FSM)
        - HightThroughputScreen
        - Histology
        - Intensity Quantification
        - Laser Capture Microdissection (LCM)
        - Localization
        - Morphometry
        - OpticalTrapping
        - PGI-Documentation
        - PhotoAblation
        - Single Molecule Imaging (SMI)
        - TimeLapse
        - Other
    - name: LabellingMethod
      type: string
      required: true
      description: This field records a term that describes the method used for the Labelling or Visualization of the structures
        (i.e. molecular components) under study in this Experiment. The use of a sub-class of the 'Visualization Method' (http://purl.obolibrary.org/obo/FBbi_00000031)
        term from the Biological Imaging Methods Ontology (FBbi; https://www.ebi.ac.uk/ols/ontologies/fbbi) is recommended.
    - name: LabellingMethodTermAccession
      type: string
      required: false
      description: This field records the Accession ID for the term used to describe the Visualization Method (also often
        referred to as Labelling Method). The use of a sub-classes of 'Visualization Method' (http://purl.obolibrary.org/obo/FBbi_00000031)
        from the Biological Imaging Methods Ontology (FBbi; https://www.ebi.ac.uk/ols/ontologies/fbbi) is recommended.
    - name: Tag
      type: string
      required: false
      description: This field describes small molecules, peptides or full proteins that were used as label in this Experiment.
        The use of a sub-class of the 'Tag' (http://purl.obolibrary.org/obo/MI_0507) term from the Molecular Interactions
        Controlled Vocabulary (MI; http://purl.obolibrary.org/obo/mi.owl) is recommended.
    - name: TagTermAccession
      type: string
      required: false
      description: This records the Accession ID for the term used to describe the Tag used in this Experiment. The use of
        a sub-class of http://purl.obolibrary.org/obo/MI_0507 is recommended.
    - name: HystochemistryType
      type: string
      required: false
      description: This field records a term that describes the general category of Histochemistry staining used in this case.
      constraints:
        enum:
        - Acid fuschin
        - Alcian blue
        - Aniline Blue
        - Azan
        - Chrome alum/haemotoxylin
        - Eosin
        - Giemsa
        - Histochemistry stains
        - Isamin blue/eosin
        - Masson's trichrome
        - Methyl green
        - Methylene blue
        - Nissl and methylene blue
        - Orange G
        - Periodic acid-Schiff reaction (PAS)
        - Pyronin G
        - Reticulin Stain
        - Silver and gold
        - Sudan Black and osmium
        - Toluidine blue
        - van Gieson
        - Other
    - name: Experimenter
      type: list
      required: true
      description: This empty element refers to Experimenter that performed this experiment.
      items: string
    - name: Description
      type: string
      required: false
      description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
        a simple multi-line comment) describing this component.
    - name: Sample
      type: list
      required: false
      description: This field captures a description of the sample that was imaged in this experiment.
      items: Sample
      owns: true
    - name: Tier
      type: integer
      required: false
      description: The tier level of this component.
  WavelengthProfileFile:
    description: This element consists of a file containing the Wavelength profile of this hardware component.
    fields:
    - name: ID
      type: string
      required: true
      description: A Unique Identifier for this element.
      is_identifier: true
    - name: Namespace
      type: string
      required: true
      description: We recommend the inclusion of a namespace for annotations you define. If it is absent then we assume the
        annotation is to use our (OME's) default interpretation for this type.
    - name: Annotator
      type: string
      required: false
      description: The Annotator is the person who attached this annotation.e.g. If UserA annotates something with TagB, owned
        by UserB, UserA is still the Annotator.
    - name: Description
      type: string
      required: false
      description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
        a simple multi-line comment) describing this component.
  GenericOpticalApertureSettings:
    description: This element holds the Setting applied to a Generic Optical Aperture used during the Acquisition of this
      Channel as well as a reference (the ID attribute) to the Optical Aperture in question.
    fields:
    - name: ID
      type: string
      required: false
      description: This is the Unique Identifier of the device used in this case.
      is_identifier: true
    - name: TransmissionWavelengthRangeSettings
      type: list
      required: false
      description: This element records the range of Transmission Wavelengths that were set for this optical component during
        the Acquisition of this Image. It also records the maximum amount of light transmitted. Multiple of this elements
        can be used.
      items: GenericOpticalApertureSettings_TransmissionWavelengthRangeSettings
      owns: true
    - name: ReflectionWavelengthRangeSettings
      type: list
      required: false
      description: This element records the range of Reflection Wavelengths that were set for this optical component during
        the Acquisition of this Image. It also records the maximum amount of light transmitted. Multiple of this elements
        can be used.
      items: GenericOpticalApertureSettings_ReflectionWavelengthRangeSettings
      owns: true
    - name: TransmittanceProfileFile
      type: list

        - ly
        - pc
        - pt
        - Pixel
        - reference frame
    - name: AngleOfIncidence
      type: float
      required: false
      description: This field records the optimal angle of incidence (AOI) for this Mirror. The AOI is the angle between the
        optical axis of the incident light and the axis normal to the surface of the Mirror. In specular reflection AOI is
        by definition equal to the Angle Of Reflection (AOR).
    - name: AngleOfIncidenceUnit
      type: string
      required: false
      constraints:
        enum:
        - deg
      example: deg
    - name: SubstrateType
      type: string
      required: false
      description: This field records the type of Substrate that is used for this Mirror. It is typically a ground and polished
        piece of optical glass.
    - name: SubstrateMaterial
      type: string
      required: false
      description: This field records the chemical composition or the designation of the substrate of this Mirroring Device.
        The substrate is typically composed of a glass material with low autofluorescence, such as UV-grade fused silica or
        Borofloat.
      constraints:
        enum:
        - alpha-Barium Borate
        - Barium Crown (BAK/N-BAK)
        - Barium Flint (BAF/N-BAF)
        - Barium Heavy Flint (BASF/N-BASF)
        - Barium Light Flint (BALF/N-BALF)
        - Borofloat
        - Boron Crown (BK/N-BK)
        - Borosilicate
        - Calcite
        - Calcium Fluoride (CaF2
        - Crown (K/N-K)
        - Crown Flint (KF/N-NK)
        - Crystal Quartz
        - Dense Crown (SK/N-SK)
        - Dense Flint (SF/N-SF)
        - Extra Dense Crown (SSK/N-SSK)
        - Extra Ligh Flint (LLF)
        - Flint (F/N-F)
        - Fluorine Crown (FK/N-FK)
        - Germanium
        - Lanthanum Crown (LAK/N-LAK)
        - Lanthanum Dense Flint (LASF/N-LASF)
        - Lanthanum Flint (LAFN/N-LAF)
        - Light Flint (LF)
        - Magnesium Fluoride (MgF2)
        - Phosphate Crown (PK/N-PK)
        - Phosphate Dense (PSK/N-PSK)
        - Polytetrafluoroethylene (PFTE)
        - Pyrex
        - Rutile (TiO2)
        - Short Flint Special (KZFS/N-KZFS)
        - Silicon (Si)
        - UV-Grade Fused Silica (UVFS)
        - Yttrium Orthovanadate (YVO4)
        - Zerodur (Lithium Aluminum Ailicon Oxide)
        - Zinc Crown (ZK/N-ZK)
        - Zinc Selenide (ZnSe)
        - Other
    - name: GlassCode
      type: string
      required: false
      description: If available, this field records the international Glass Code of the material that constitutes this Mirror.
        The Glass Code designation is based on U.S. military standard MIL-G-174, and it consists of a six-digit number specifying
        the glass according to its Refractive Index nd at the Fraunhofer d- (or D3-) line, and its Abbe Number Vd also taken
        at that line. The resulting Glass Code is the value of nd-1 rounded to three digits, followed by Vd rounded to three
        digits, with all decimal points ignored. For example, BK7 has nd = 1.5168 and Vd = 64.17, giving a six-digit Glass
        Code of 517642.
    - name: Manufacturer
      type: string
      required: true
      description: This field refers to the company, research group or individual who built or manufactured this hardware
        component.
    - name: Model
      type: string
      required: true

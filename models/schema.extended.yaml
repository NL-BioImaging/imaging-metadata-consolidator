    - name: ID
      type: string
      required: true
      description: A Unique Identifier for this component.
      is_identifier: true
    - name: Mount
      type: string
      required: false
      description: This field records the type of Mount used to connect this detector to the Microscope Stand.
      constraints:
        enum:
        - C-mount
        - D-SLR adapter
        - SLR adapter
        - T-mount
        - Other
      example: C-mount
    - name: MaxBitDepth
      type: string
      required: true
      description: This field records the Maximum Bit Depth provided by the Detector's Analog to Digital Converter (ADC; also
        referred to as Digitizer).
      constraints:
        enum:
        - 8bit
        - 12bit
        - 14bit
        - 16bit
        - 32bit
        - 64bit
    - name: QuantumEfficiency
      type: float
      required: true
      description: This field records the Quantum Efficiency observed at Peak Wavelength, according to the Manufacturer. Quantum
        Efficiency is generally defined as is the ratio of incident photons to converted electrons. Typically expressed as
        a number between 0 and 1.
    - name: ElectronicConversionFactor
      type: float
      required: true
      description: This field records the Electron-Conversion Factor for this Detector, as specified by the Manufacturer.

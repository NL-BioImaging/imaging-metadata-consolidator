name: LiMi-extended
version: '2.1'
description: Microscopy metadata profile converted from models/fullSchema.json (LiMi model version 2.01.1), extended with
  mappings/schema.extended.json
root_entity: OME
entities:
  Instrument:
    description: This element describes the Instrument used to capture the Image. It is primarily a container referring to
      the list of hardware components included in a given Microscope. The list consists of the Microscope Stand, Microscope
      Table, Light Source, Light Source Coupling, Sample Holder, Focusing, Objective, Filter, Dichroic, Additional Lens (including
      a commonly used Magnification Changer, also known as Optovar), Additional Mirroring Device, Polarization Optics, Prism,
      Optical Aperture, Optical Device, Detector and Calibration Tool. The Filter element can be either composed of separate
      Excitation, Emission filters, and Dichroic mirrors or a single Filter Set. An Instrument might have multiple Light Sources,
      Detectors, Objectives, and Filters, etc. Each of these has its own ID attribute, which can be referred to from the Image,
      Plane or more commonly Channel elements associated with a given Image Acquisition session. It is understood that the
      Light Path configuration can be different for each Channel, but cannot be different for each timepoint or each Plane
      of an XYZ stack.
    fields:
    - name: Name
      type: string
      required: true
      description: A User-defined Name for this component.
    - name: ID
      type: string
      required: true
      description: A Unique Identifier for this component.
      is_identifier: true
    - name: Description
      type: string
      required: false
      description: This is a simple multi-line comment or annotation describing this component.
    - name: InvertedMicroscopeStand
      type: list
      required: false
      description: This is a Microscope in which the object is observed from beneath the stage.
      items: InvertedMicroscopeStand
      owns: true
    - name: UprightMicroscopeStand
      type: list
      required: false
      description: This is a Microscope in which the object is observed from above the stage.
      items: UprightMicroscopeStand
      owns: true
    - name: MicroscopeTable
      type: list
      required: false
      description: This element describes the Table used to support this Instrument during Image Acquisition.
      items: MicroscopeTable
      owns: true
    - name: AcquisitionSoftware
      type: list
      required: false
      description: This element represents a commercial, or open-source Software, script, macro, plugin or module utilized
        for driving this Instrument during Image Acquisition.
      items: AcquisitionSoftware
      owns: true
    - name: SoftwareModule
      type: list
      required: false
      description: This element represents a commercial, or open-source Software, script, macro, plugin or module utilized
        for any Image Acquisition, Image Analysis or Quality Control task.
      items: SoftwareModule
      owns: true
    - name: EnvironmentalControlDevice
      type: list
      required: false
      description: This element describes an Environmental Control Device available for this Instrument to maintain a controlled
        Imaging Environment during Imaging Environment.
      items: EnvironmentalControlDevice
      owns: true
    - name: Arc
      type: list
      required: false
      description: An Arc lamp is a discharge lamp that produces light by an electric arc (also called a voltaic arc), which
        is typically generated between metal electrodes and travels through an inert gas in a glass bulb
      items: Arc
      owns: true
    - name: Transmitted_LightSource_GenericExcitationSource
      type: list
      required: false
      description: The GenericExcitationSource element is used to represent a light source as a collection of key/value pairs,
        stored in a Map
      items: Transmitted_LightSource_GenericExcitationSource
      owns: true
    - name: Fluorescence_LightSource_GenericExcitationSource
      type: list
      required: false
      description: The GenericExcitationSource element is used to represent a light source as a collection of key/value pairs,
        stored in a Map
      items: Fluorescence_LightSource_GenericExcitationSource
      owns: true
    - name: Transmitted_LightSource_Filament
      type: list
      required: false
      description: A Filament lamp is an incandescent Light Source with a wire filament (usually tungsten), which is heated
        by the passage of an electric current to such a high temperature that it glows with visible light (incandescence)
      items: Transmitted_LightSource_Filament
      owns: true
    - name: Fluorescence_LightSource_Filament
      type: list
      required: false
      description: A Filament lamp is an incandescent Light Source with a wire filament (usually tungsten), which is heated
        by the passage of an electric current to such a high temperature that it glows with visible light (incandescence)
      items: Fluorescence_LightSource_Filament
      owns: true
    - name: Laser
      type: list
      required: false
      description: This element describes a Light Source, which emits coherent radiation at high spectral concentrations of
        radiance and minimal solid angles
      items: Laser
      owns: true
    - name: Transmitted_LightSource_LightEmittingDiode
      type: list
      required: false
      description: A Light Emitting Diode (LED) is a semiconductor light source that emits light when current flows through
        it
      items: Transmitted_LightSource_LightEmittingDiode
      owns: true
    - name: Fluorescence_LightSource_LightEmittingDiode
      type: list
      required: false
      description: A Light Emitting Diode (LED) is a semiconductor light source that emits light when current flows through
        it
      items: Fluorescence_LightSource_LightEmittingDiode
      owns: true
    - name: MultiLaserEngine
      type: list
      required: false
      description: This element describes a Light Source device that contains multiple Lasers built into a single box
      items: MultiLaserEngine
      owns: true
    - name: FreeBeam
      type: list
      required: false
      description: A Free Beam coupling between the Light Source and the Microscope Stand consists of either a direct mount
        or an optical path that directs light across free space to the back of the Microscope Stand.
      items: FreeBeam
      owns: true
    - name: LightGuide
      type: list
      required: false
      description: A Light Guide coupling between the Light Source and the Microscope Stand generally consists of a casing
        enclosing a medium (i.e., typically fiber optic) capable of transferring light from the illuminator to the back of
        the Microscope Stand.
      items: LightGuide
      owns: true
    - name: Objective
      type: list
      required: false
      description: The Microscope's Objective lens consists of a lens, its mount, and any associated parts
      items: Objective
      owns: true
    - name: BeamCollimator
      type: list
      required: false
      description: Beam Collimators are Lens Systems that transform a strongly diverging light beam into a collimated beam,
        i.e., a beam where light propagates essentially only in one direction, and the beam divergence is weak
      items: BeamCollimator
      owns: true
    - name: BeamExpander
      type: list
      required: false
      description: Beam Expanders are Lens Systems whose role is to increase the diameter of a collimated input beam to a
        larger collimated output beam
      items: BeamExpander
      owns: true
    - name: Condenser
      type: list
      required: false
      description: Condensers are Lens Systems located above the Light Source and under the sample in an Upright Microscope,
        and above the stage and below the Light Source in an Inverted Microscope
      items: Condenser
      owns: true
    - name: MicroscopeTube
      type: list
      required: false
      description: Illumination Tubes are Lens systems, which might be embedded within the Microscope Stand and therefore
        not immediately accessible
      items: MicroscopeTube
      owns: true
    - name: DarkFieldStop
      type: list
      required: false
      description: This element refers to a central circular stop (i.e., opaque disk) usually used in dark-field microscopy
        and placed in the front focal Plane of a Condenser to occlude all the direct light which would fall within the aperture
        of the objective.
      items: DarkFieldStop
      owns: true
    - name: PhaseRing
      type: list
      required: false
      description: This element (also called Phase Annulus) refers to an annular (ring-like) slit used to produce contrast
        modulation following Zernike, in which the Image contrast of a phase object is enhanced by altering the phase and
        amplitude of the direct light with respect to those of the diffracted light
      items: PhaseRing
      owns: true
    - name: HoffmanPlate
      type: list
      required: false
      description: This element represents a Plate that contains an off-axis slit aperture positioned in the front focal plane
        of the Condenser
      items: HoffmanPlate
      owns: true
    - name: IrisDiaphragm
      type: list
      required: false
      description: This element represents a Diaphragm, positioned trasversally to the optical axis bounded by multiple leaves,
        usually metal, arranged so as to provide an opening of variable size, which is adjustable by means of a mechanical
        control.
      items: IrisDiaphragm
      owns: true
    - name: VarelRing
      type: list
      required: false
      description: This element represents a stop (i.e., opaque structure) shaped like a ring sector, which is used on the
        illumination side, to permit unilateral inclined illumination
      items: VarelRing
      owns: true
    - name: Shutter
      type: list
      required: false
      description: This element describes a Shutter available for this Instrument
      items: Shutter
      owns: true
    - name: StageInsert
      type: list
      required: false
      description: This element describes an optional Stage Insert mounted on the Stage.
      items: StageInsert
      owns: true
    - name: Z-Drive
      type: list
      required: false
      description: This element describes a Focusing Device designed to electronically control a moving a mechanical part
        of the Microscope such as the Stage (see Stage-APE), or the Microscope Stand itself (e.g
      items: Z-Drive
      owns: true
    - name: TurretObjectiveFocusing
      type: list
      required: false
      description: A Focusing mechanism is used to obtain maximum sharpness in an Image by changing the distance between a
        Sample and the optical system forming the Image
      items: TurretObjectiveFocusing
      owns: true
    - name: IndividualObjectiveFocusing
      type: list
      required: false
      description: A Focusing mechanism is used to obtain maximum sharpness in an Image by changing the distance between a
        Sample and the optical system forming the Image
      items: IndividualObjectiveFocusing
      owns: true
    - name: MechanicalStage
      type: list
      required: false
      description: This element describes a Stage fitted with ball-screw drives or rack mechanisms (sometimes equipped with
        precision calibration) to primarily assist in the translational movement of the Sample in the X and Y directions
      items: MechanicalStage
      owns: true
    - name: PiezoElectricStage
      type: list
      required: false
      description: This describes an optional piezoelectric-driven sample nano-positioning device associated with this Instrument
      items: PiezoElectricStage
      owns: true
    - name: FocusStabilizationDevice
      type: list
      required: false
      description: This element describes an optional focus stabilization device (also known as, Auto Focus) that may be used
        for bringing an object automatically into focus for this instrument
      items: FocusStabilizationDevice
      owns: true
    - name: FilterCube
      type: list
      required: false
      description: A Filter Cube is a removable cube-shaped unit that containing the filters and mirror used in epi-fluorescence
        microscopy to separate fluorescence excitation and emission light
      items: FilterCube
      owns: true
    - name: FilterCubeTurret
      type: list
      required: false
      description: This element represents a circular holder for multiple Filter Cubes.
      items: FilterCubeTurret
      owns: true
    - name: ExcitationFilterWheel
      type: list
      required: false
      description: This element represents a circular holder for multiple individual Excitation Filters.
      items: ExcitationFilterWheel
      owns: true
    - name: DichroicFilterWheel
      type: list
      required: false
      description: This element represents a circular holder for multiple individual Dichroics.
      items: DichroicFilterWheel
      owns: true
    - name: EmissionFilterWheel
      type: list
      required: false
      description: This element represents a circular holder for multiple individual Emission Filters.
      items: EmissionFilterWheel
      owns: true
    - name: ExcitationFilterSlider
      type: list
      required: false
      description: This element represents a linear holder for multiple individual Excitation Filters.
      items: ExcitationFilterSlider
      owns: true
    - name: DichroicFilterSlider
      type: list
      required: false
      description: This element represents a linear holder for multiple individual Dichroics.
      items: DichroicFilterSlider
      owns: true
    - name: EmissionFilterSlider
      type: list
      required: false
      description: This element represents a linear holder for multiple individual Emission Filters.
      items: EmissionFilterSlider
      owns: true
    - name: OpticsTurret
      type: list
      required: false
      description: This element represents a circular holder for multiple optical elements.
      items: OpticsTurret
      owns: true
    - name: ExcitationFilter
      type: list
      required: false
      description: An optical Filter is a device designed to selectively control the Wavelengths, color temperature, vibration
        direction, and/or intensity of the radiation which it transmits or reflects
      items: ExcitationFilter
      owns: true
    - name: EmissionFilter
      type: list
      required: false
      description: An optical Filter is a device designed to selectively control the Wavelengths, color temperature, vibration
        direction, and/or intensity of the radiation which it transmits or reflects
      items: EmissionFilter
      owns: true
    - name: NeutralDensityFilter
      type: list
      required: false
      description: An optical Filter is a device designed to selectively control the Wavelengths, color temperature, vibration
        direction, and/or intensity of the radiation which it transmits or reflects
      items: NeutralDensityFilter
      owns: true
    - name: GenericFilter
      type: list
      required: false
      description: An optical Filter is a device designed to selectively control the Wavelengths, color temperature, vibration
        direction, and/or intensity of the radiation which it transmits or reflects
      items: GenericFilter
      owns: true
    - name: StandardDichroic
      type: list
      required: false
      description: A Dichroic Mirror (also often referred to as Dichroic Beamsplitter or simply as Dichroic) is a Mirror that
        spectrally separate light by transmitting and reflecting light as a function of wavelength
      items: StandardDichroic
      owns: true
    - name: GenericDichroic
      type: list
      required: false
      description: A Dichroic Mirror (also often referred to as Dichroic Beamsplitter or simply as Dichroic) is a Mirror that
        spectrally separate light by transmitting and reflecting light as a function of wavelength
      items: GenericDichroic
      owns: true
    - name: BeamSplitter
      type: list
      required: false
      description: This element describes a Mirror that reflects part of the light, regardless of wavelength.
      items: BeamSplitter
      owns: true
    - name: ReflectingMirror
      type: list
      required: false
      description: This element describes a total reflection Mirror.
      items: ReflectingMirror
      owns: true
    - name: MagnificationChanger
      type: list
      required: false
      description: A Magnification Changer (also known as Optovar because one of the first magnification changing devices
        was developed by Zeiss and given this proprietary Name) provides additional magnification that can be beneficial when
        a desired field of view is required for the imaging sensor
      items: MagnificationChanger
      owns: true
    - name: GenericLens
      type: list
      required: false
      description: This element refers to any additional Generic Lens positioned in the Light Path for a given Channel.
      items: GenericLens
      owns: true
    - name: BeamExpanderLens
      type: list
      required: false
      description: A Beam Expander Lens is a Lens designed to work in combination with other optical components to form a
        Beam Expander device
      items: BeamExpanderLens
      owns: true
    - name: BeamCollimatorLens
      type: list
      required: false
      description: A Beam Collimator Lens is a Lens designed to work in combination with other optical components to form
        a Beam Collimator device
      items: BeamCollimatorLens
      owns: true
    - name: CondenserLens
      type: list
      required: false
      description: A Condenser Lens renders a divergent beam from a point source into a parallel or converging beam to illuminate
        an object
      items: CondenserLens
      owns: true
    - name: CouplingLens
      type: list
      required: false
      description: This element refers to a Lens positioned at the mount connecting the Light Source Coupling device and the
        Microscope Stand.
      items: CouplingLens
      owns: true
    - name: RelayLens
      type: list
      required: false
      description: A Relay Lens is often used in combination with other Lenses for transferring an Image into a different
        optical plane
      items: RelayLens
      owns: true
    - name: TubeLens
      type: list
      required: false
      description: A Tube Lens is an intermediate Lens, located within the Microscope's Illumination Tube, which is designed
        to operate as an essential component of infinity-corrected Objectives, and which should be regarded as an integral
        part of the Objective lens system when magnification and correction are considered
      items: TubeLens
      owns: true
    - name: Prism
      type: list
      required: false
      description: This element describes a Prism positioned in the Light Path for one or more Channels available for this
        Instrument
      items: Prism
      owns: true
    - name: PolarizationOptics
      type: list
      required: false
      description: This element describes a Polarization device positioned in the Ligth Path for this Instrument
      items: PolarizationOptics
      owns: true
    - name: GenericDetector
      type: list
      required: false
      description: This element is used to represent a Generic Detector as a collection of Key/Value pairs, which are stored
        in a Map
      items: GenericDetector
      owns: true
    - name: CCD
      type: list
      required: false
      description: This element represents a Charged Coupled Device Camera.
      items: CCD
      owns: true
    - name: AnalogVideo
      type: list
      required: false
      description: This element represents a device used to capture Analog Videos.
      items: AnalogVideo
      owns: true
    - name: CMOS
      type: list
      required: false
      description: This field records a complementary metal–oxide–semiconductor camera
      items: CMOS
      owns: true
    - name: IntensifiedCamera
      type: list
      required: false
      description: This field records an intensified Camera.
      items: IntensifiedCamera
      owns: true
    - name: PhotoMultiplierTube
      type: list
      required: false
      description: A Photomultiplier Tube (PMT) is a photoemissive device in which the absorption of a photon results in the
        emission of an electron and it is used for the detection of very weak signals
      items: PhotoMultiplierTube
      owns: true
    - name: PhotoDiode
      type: list
      required: false
      description: This element represents a Photovoltaic Detector
      items: PhotoDiode
      owns: true
    - name: HybridPhotoDetector
      type: list
      required: false
      description: This element represents a hybrid Photomultiplier and Avalanche Photodiode (APD).
      items: HybridPhotoDetector
      owns: true
    - name: IntensityCalibrationTool
      type: list
      required: false
      description: A tool, such as the Meta-Max calibration toold developed by the 4D Nucleome Imaging Standards Working Group,
        used to perform an intensity calibration procedure.
      items: IntensityCalibrationTool
      owns: true
    - name: CustomProperties
      type: list
      required: false
      description: Source metadata values the profile does not model.
      items: Property
      owns: true
    - name: Manufacturer
      type: string
      required: false
      description: From the extended schema (Instrument.Manufacturer).
    - name: Model
      type: string
      required: false
      description: From the extended schema (Instrument.Model).
    - name: Type
      type: string
      required: false
      description: From the extended schema (Instrument.Type).
    - name: ComputerName
      type: string
      required: false
      description: From the extended schema (Instrument.ComputerName).
    - name: Vacuum
      type: entity
      required: false
      description: From the extended schema (Instrument.Vacuum).
      items: Instrument_Vacuum
      owns: true
    - name: Tier
      type: integer
      required: false
      description: The tier level of the microscope.
  Image:
    description: This element describes the actual Image that was acquired and its meta-data. The elements that are references
      (ending in Ref or Settings) refer to elements defined outside of the Image element. Ref elements are simple links, while
      Settings elements are links with additional values. If any of the required Image attributes or elements are missing,
      its guaranteed to be an invalid document.
    fields:
    - name: Name
      type: string
      required: true
      description: A user assigned name for this Image.
    - name: ID
      type: string
      required: true
      description: A unique identifier for this Image.
      is_identifier: true
    - name: AcquisitionDate
      type: string
      required: false
      description: The Date in which this Image was Acquired.
    - name: InstrumentName
      type: string
      required: true
      description: Name of the instrument
    - name: InstrumentID
      type: string
      required: false
      description: ID of the instrument
    - name: StageInsert
      type: list
      required: false
      description: This empty element refers to the optional Stage Insert device that was used for the Acquisition of this
        Image.
      items: StageInsert
    - name: FocusStabilizationDevice
      type: list
      required: false
      description: This empty element refers to the optional Focus Stabilization Device that was used for the Acquisition
        of the experimental Image this Mechanical Calibration procedure refers to.
      items: FocusStabilizationDevice
    - name: AcquisitionSoftware
      type: list
      required: true
      description: This empty element refers to the Software that was used to drive the Microscope during the Image Acquisition.
      items: AcquisitionSoftware
    - name: Description
      type: string
      required: false
      description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
        a simple multi-line comment) describing this component.
    - name: ImagingEnvironment
      type: list
      required: false
      description: This element describes the environment in which the biological sample was maintained during the Acquisition
        of this Image.
      items: ImagingEnvironment
      owns: true
    - name: MicroscopeStandSettings
      type: entity
      required: false
      description: This element refers to the Microscope Stand used to acquire this Image and it holds the Settings that were
        applied to the Microscope Stand during this Acquisition.
      items: MicroscopeStandSettings
      owns: true
    - name: MicroscopeTableSettings
      type: list
      required: false
      description: This element refers to the MicroscopeTable used to support the Microscope used to acquire this Image and
        holds the settings that were applied to the Microscope during this Acquisition.
      items: MicroscopeTableSettings
      owns: true
    - name: ObjectiveSettings
      type: entity
      required: false
      description: This element holds the Setting applied to the Objective used during the Acquisition of this Image as well
        as a reference (the ID attribute) to the Objective in question.
      items: ObjectiveSettings
      owns: true
    - name: StageLabel
      type: list
      required: false
      description: The StageLabel is used to specify the Name and Position for a Stage position in the Microscope's reference
        frame.
      items: StageLabel
      owns: true
    - name: SamplePositioningSettings
      type: list
      required: false
      description: This element holds the Setting applied to a Sample Positioning Device used  during the Acquisiton of this
        experimental Image as well as a reference (the ID attribute) to the Sample Positioning Device in question.
      items: SamplePositioningSettings
      owns: true
    - name: Pixels
      type: entity
      required: false
      description: The Pixels element is going to be removed in the future, but it is still required
      items: Pixels
      owns: true
    - name: CustomProperties
      type: list
      required: false
      description: Source metadata values the profile does not model.
      items: Property
      owns: true
    - name: SourceFile
      type: list
      required: false
      description: The files this Image's metadata was read from.
      items: SourceFile
      owns: true
    - name: Type
      type: string
      required: false
      description: From the extended schema (Image.Type).
    - name: CropHint
      type: entity
      required: false
      description: From the extended schema (Image.CropHint).
      items: Image_CropHint
      owns: true
    - name: Corrections
      type: entity
      required: false
      description: From the extended schema (Image.Corrections).
      items: Image_Corrections
      owns: true
    - name: BinaryResult
      type: string
      required: false
      description: From the extended schema (Image.BinaryResult).
    - name: Tier
      type: integer
      required: false
      description: The tier level of the microscope.
  CameraSettings:
    description: This element refers to the Camera used to acquire this Channel and it holds the Settings that were applied
      to the Camera during this Acquisition.
    fields:
    - name: Binning
      type: string
      required: true
      description: This field represents the number of adjacent pixels whose electric charge is combined in the resulting
        Image (e.g. binning = 2x2). Generally, binning increases read-out rates, signal-to-noise ratio, and relative sensitivity,
        while it reduces the spatial resolution.
      constraints:
        enum:
        - 1x1
        - 2x2
        - 4x4
        - 8x8
        - Other
    - name: PixelReadOutRate
      type: float
      required: true
      description: This represents the effective Pixel Readout Rate used for the Acquisition of this Channel. This value is
        defined as the inverse of the time required to digitize a single pixel (also referred to as serial conversion time).
        Pixel readout rate can be considered similar to a baud rate as it depends on the bytes per second that can be read
        from the detector and written on disk. Readout rates are usually given in pixels/second (e.g., 500 kilopixels/second).
    - name: PixelReadOutRateUnit
      type: string
      required: false
      constraints:
        enum:
        - YHz
        - ZHz
        - EHz
        - PHz
        - THz
        - GHz
        - MHz
        - kHz
        - hHz
        - daHz
        - Hz
        - dHz
        - cHz
        - mHz
        - µHz
        - nHz
        - pHz
        - fHz
        - aHz
        - zHz
        - yHz
        - fps
        - Pixel per second
      example: Hz
    - name: SensorExposureMode
      type: string
      required: true
      description: In case of a CMOS Camera and if selectable, this field reports the sensor Exposure modality used for the
        Acquisition of this Channel. In the Rolling Exposure mode adjacent rows of the array are exposed at slightly different
        times as the readout 'waves' sweep through each half of the sensor. In the Global Exposure mode (i.e., 'Snapshot'
        exposure mode) all pixels of the array are exposed simultaneously, thus enabling 'freeze frame' capture of fast moving
        or fast changing events. In this modality the CMOS Camera behaves like an interline CCD sensor.
      constraints:
        enum:
        - Global shutter
        - Rolling shutter
        - Other
    - name: Integration
      type: integer
      required: true
      description: This field represents the number of sequential frames that have been averaged to obtain this image, to
        improve the overall signal-to-noise ratio.
    - name: FrameRate
      type: float
      required: true
      description: Frame Rate is the inverse of the time needed for the CCD to acquire a single Frame (or Plane) and then
        completely read that image out. Frame Rate is typically expressed in frames per second (fps). Often, the Frame Rate
        can be approximately calculated from the total number of pixels and the readout rate, combined with the total exposure
        time. This field represents the effective Frame Rate used for the Acquisition of this Image.
    - name: FrameRateUnit
      type: string
      required: false
      constraints:
        enum:
        - YHz
        - ZHz
        - EHz
        - PHz
        - THz
        - GHz
        - MHz
        - kHz
        - hHz
        - daHz
        - Hz
        - dHz
        - cHz
        - mHz
        - µHz
        - nHz
        - pHz
        - fHz
        - aHz
        - zHz
        - yHz
        - fps
        - Pixel per second
      example: fps
    - name: OperatingTemperature
      type: float
      required: false
      description: This field represents the effective temperature the sensor was kept at during the Acquisition of this image.
    - name: OperatingTemperatureUnit
      type: string
      required: false
      constraints:
        enum:
        - °C
        - °F
        - K
        - °R
      example: °C
    - name: ID
      type: string
      required: true
      description: A Unique Identifier for this component.
      is_identifier: true
    - name: EffectiveBitDepth
      type: string
      required: true
      description: If selectable, this field reports the Effective Bit Depth that was used by the Detector's Analog to Digital
        Converter (ADC; also referred to as Digitizer) for the Acquisition of this Channel.
      constraints:
        enum:
        - 8bit
        - 12bit
        - 14bit
        - 16bit
        - 32bit
        - 64bit
    - name: AnalogGain
      type: float
      required: true
      description: 'This field reports the Analog Gain (also known as Inherent Gain or simply as Gain) that was applied during
        the Acquisition of this Image. The Analog Gain is a property Inherent to the Detector and it specifies how many electrons
        correspond to 1 signal unit (photon) detected. Gain is reported in terms of electrons/ADU (analog-to-digital unit).
        A gain of 8 means that the Detector digitizes the light signal so that each ADU corresponds to 8 photoelectrons. NOTE:
        In the case of Point Detectors the value of Analog Gain can be set freely by the user. Conversely, in the case of
        Cameras, it is common for the Gain to be preset by the Manufacturer to minimize noise. In this case, either the Analog
        Gain cannot be changed or the user is given the choice of selecting between a few preset Analog Gains values upon
        Acquisition. Finally, several Cameras might have so-called Automatic Gain Control (AGC or AutoGain) that will automatically
        adjusts so the full range of the Analog-to-Digital Converter (ADC) is used. Unless you can turn off the AGC, the use
        of these Cameras are highly discouraged for quantitative work.'
    - name: AmplificationGain
      type: float
      required: true
      description: 'This field reports the Amplification Gain (i.e., electronic gain as apposed to the inherent Gain) that
        was set during the Acquisition of this Image. Amplification Gain in general measures of the ability of a Detector
        to add energy to the input light signal therefore increasing its power or amplitude. Higher Amplification Gain levels
        amplify the signal and result in greater brightness, contrast and background signal. Examples include: 1) the Electron
        Multiplication (EM) gain (as opposed to the inherent Analog Gain) for an EMCCD camera. 2) The Gain introduced by the
        Micro-Channel Plate in an Intensified CCD or CMOS camera. 3) The amplification of the electron current provided by
        a Photomultiplier Tube, and measured as the ratio of the input photoelectron current emitted by the photocatode and
        the current reaching the anode. 4) The signal amplification provided by an Avalache Photo Diode (APD).'
    - name: Offset
      type: float
      required: false
      description: 'If available, this field reports the actual Offset that was set for this Detector during the Acquisition
        of this Channel. Offset is an electronic baseline added to the output signal generated by the sensor to ensure that
        the resulting signal level always correspond to a positive number of counts. Offset defines the black level setting
        of the image and it should be adjusted so that the lowest signals are near the detection threshold. NOTE: Please note
        that most modern Cameras do not have the possibility of setting the Offset.'
    - name: OffsetMode
      type: string
      required: false
      description: This field describes the way in which the Voltage Offset of the Detector is reported. It typically is expressed
        as an Arbitrary-units number, a Scaled percent (-100 to 100), or a a Voltage.
      constraints:
        enum:
        - Arbitrary units
        - Scaled percentage
        - Voltage
        - Other

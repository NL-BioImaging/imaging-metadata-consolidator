  GenericDichroic_ReflectanceRange:
    description: This element records the Range (also known as Band) of Wavelengths that are reflected by this optical componewnt.
      It also records the maximum amount of light reflected. Multiple of these elements can be used.
    fields:
    - name: Wavelength
      type: float
      required: true
      description: This field records the key Wavelength that characterizes this Reflectance Range (also known as Reflection
        band). In most cases, Wavelength refers to the CutOn Wavelength (i.e., below which there is less than 50% transmittance)
        but it might also refer to the CutOff wavelength (i.e., above which there is less than 50% transmittance) or the Center
        Wavelength of the Reflectance Band.
    - name: FWHMBandwidth
      type: float
      required: true
      description: This field records the width of this Reflectance Range (also known as Reflection band). Specifically, the
        Full Width at Half Maximum (FWHM) represents the bandwidth of the Wavelength spectrum curve measured between those
        points whose transmission amplitude is 50% of the maximum. In case bandwidth is not available, such as in the case
        of a LongPass, Notch or ShortPass configuration, please enter 000.

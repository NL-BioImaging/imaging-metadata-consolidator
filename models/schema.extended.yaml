  Objective:
    description: The Microscope's Objective lens consists of a lens, its mount, and any associated parts. It is the part of
      the imaging system, which forms a primary image of the object, either alone or in conjunction with a tube lens. The
      Objective typically consists of a compound lens consisting of along a common axis.
    fields:
    - name: Name
      type: string
      required: false
      description: A User-defined Name for this component.
    - name: ID
      type: string
      required: true
      description: A Unique Identifier for this component.
      is_identifier: true
    - name: Magnification
      type: float
      required: true
      description: This field captures the Magnification of the Objective as specified by the Manufacturer - i.e., 60 represents
        a 60X lens.
    - name: LensNA
      type: float
      required: true
      description: This field captures the nominal Numerical Aperture (NA) of this Objective as specified by the Manufactuer,
        expressed as a floating-point (real) number (e.g. 1.27 NA). NA is a number that was defined initially by Abbe to characterize
        Objectives and Condensers. NA can be calculated by the expression n sin alpha, where n is the Refractive Index of
        the medium between the Lens and the Sample, and alpha is half the Angular Aperture of the Lens. NA is a measure of
        how much of the illumination that leaves the specimen actually passes through the Lens. The larger the NA, the more
        information the lens can transmit. Expected range 0.02 - 1.5.
    - name: Correction
      type: string
      required: true
      description: This field captures the type of optical correction (i.e. chromatic correction, or flatness correction,
        etc.) associated with this Objective.
      constraints:
        enum:
        - Achro
        - Achromat
        - Achroplan
        - Acroplan
        - Apo
        - Apochromat
        - C-Achroplan
        - EF
        - Fl
        - Fluar
        - Fluor
        - Fluotar
        - Lambda
        - N
        - Neofluar
        - NPL
        - Pl
        - Plan
        - Plano
        - PlanApo
        - PlanApochromat
        - PlanFluor
        - PlanNeofluar
        - SuperFluor
        - UPLAN
        - UPlanApo
        - UPlanFl
        - UV
        - VioletCorrected
        - Other
    - name: ImmersionType
      type: string
      required: true
      description: According to ISO 10934-1:2002, an Immersion Liquid is a liquid (commonly immersion oil, water or glycerol)
        specified as suitable for use in the space between the front of an immersion lens and the object NOTE Because the
        immersion liquid is considered in the computing of corrections to be part of the lens, its refractive index and dispersion
        (or Abbe number) are critical. Please refer to ISO 8036-1 for more details on Immersion Oil. This field describes
        the general category of the Immersion Liquid this Objective is designed for, according to the Manufacturer. If the
        general category is not Air, the actual Immersion Liquid that was used during the Acquisition of a specific Image
        must be specified in Objective Settings.
      constraints:
        enum:
        - Air
        - Dipping
        - Glycerol
        - Multi
        - Mineral Oil
        - Silicone Oil
        - Water
        - Other
    - name: InfinityCorrected
      type: boolean
      required: true
      description: This field records whether (True) or not (False) this Objective is infinity corrected. An Infinity-corrected
        Objective is corrected for an infinite sample to primary image distance and needs to be used with a Tube Lens of appropriate
        focal length to obtains its nominal magnification.
    - name: ContrastModulation
      type: string
      required: true
      description: This field specifies the presence in this Objective of a contrast modulation device, such as a Phase Ring
        (Ph1, Ph2, Ph3), a Hoffman modulator, a Varel modulator, or similar.
      constraints:
        enum:
        - None
        - Ph1
        - Ph2
        - Ph3
        - Hoffman
        - VAREL
        - Other
    - name: DIC
      type: boolean
      required: true
      description: This field specifies whether (True) the Objective is designed for Differential Interference Contrast (DIC)
        or not (False). DIC is a contrast modality due to double-beam interference in which two waves that fall on the object
        Plane or Image Plane are separated laterally by a distance similar to the minimum resolvable distance.
    - name: LightType
      type: string
      required: false
      description: This field specifies whether this Objective is designed for a special Light application (e.g., IR or UV).
      constraints:
        enum:
        - Infrared
        - Ultraviolet
        - Visible
      example: Visible
    - name: DippingMedium
      type: string
      required: false
      description: In case the Immersion Type for this Objective is designated as Dipping, this field captures the type of
        Dipping Medium this Objective is compatible with. Examples include, water-based (biological buffers, culture media,
        other water-based solutions) organic-based [FocusClear (CLARITY); CUBIC-1, CUBIC-2, CUBIC-R1, CUBIC-R2; 2,2-thiodiethanol
        (TDE); ethyl cinnamate; Benzyl Benzoate and BB-PEG (PEGASOS); Benzyl Alcohol, Benzyl Benzoate (BABB); dibenzyl ether
        (DBE); 100% Ethanol].
      constraints:
        enum:
        - Water-based
        - Organic-based
        - Other
    - name: WorkingDistance
      type: float
      required: true
      description: This field reports the Working Distance of this Objective under normal operating conditions. The Working
        Distance is the distance (in air, or in the specified immersion liquid) between the front of an Objective and the
        surface of the cover glass or of the specimen if uncovered.
    - name: WorkingDistanceUnit
      type: string
      required: false
      constraints:
        enum:
        - Ym
        - Zm
        - Em
        - Pm
        - Tm
        - Gm
        - Mm
        - km
        - hm
        - dam
        - m
        - dm
        - cm
        - mm
        - µm
        - nm
        - pm
        - fm
        - am
        - zm
        - ym
        - Å
        - thou
        - li
        - in
        - ft
        - yd
        - mi
        - ua
        - ly
        - pc
        - pt
        - Pixel
        - reference frame
      example: mm
    - name: CorrectionCollar
      type: boolean
      required: true
      description: This field records whether (True) or not (False) the Objective was fitted with a Correction Collar. When
        using high NA dry Objectives (NA 0.8 or greater), cover glass thickness variations of only a few micrometers, immersion
        medium, and temperature changes result in dramatic image degradation due to aberration. To compensate for these errors,
        the more highly corrected Objectives are equipped with a Correction Collar mechanism, which is provided to adjust
        the central lens group position to compensate for deviations from correct optical path length due to changes in Cover
        Glass Thickness, the nature of the Immersion Liquid, different Numerical Apertures, and Temperature.
    - name: CorrectionCollarType
      type: string
      required: false
      description: This field records the type of Correction Collar with which this Objective is fitted. In case the Objective
        has more than one Correction Collar please enter 'Multi' and provide more details in Description.
      constraints:
        enum:
        - Coverglass Thickness
        - Immersion Liquid
        - Numerical Aperture
        - Temperature
        - Multi
    - name: PhaseContrastDesignation
      type: string
      required: false
      description: 'If the Objective is designed for Phase, this field specifies the Phase Contrast type designation (see:
        https://www.microscopyu.com/techniques/phase-contrast/phase-contrast-Microscope-configuration).'
      constraints:
        enum:
        - Phase
        - PHACO
        - PC
        - PhL
        - Ph1
        - Ph2
        - Ph3
        - Ph4
        - DL
        - DLL
        - DM
        - ADL
        - PL
        - PLL
        - PM
        - PH
        - NL
        - NM
        - BM
        - NH
    - name: CalibratedMagnification
      type: float
      required: false
      description: This field captures the Magnification of the Objective as measured via a calibration process- i.e., '59.987'
        for a 60x lens.
    - name: Iris
      type: boolean
      required: false
      description: This field records whether (True) or not (False) the Objective was fitted with an Iris. Manufacturers offer
        high NA Objectives, which are equipped with an internal Iris Diaphragm that increases image contrast during digital
        imaging to compensate for image flare artifacts due to light emitted from areas outside the focal plane. Opening or
        closing the Iris Diaphragm determines the size of the Objective rear aperture yielding a variable NA range between
        0.5 and the Objective's upper limit.
    - name: ObjectiveViewField
      type: float
      required: true
      description: 'This field records the maximal diameter of the view field allowed by this Objective, expressed in mm,
        and measured at the intermediate Image Plane. NB: The field of view is influenced by the magnification and diameter
        of the ocular (eyepiece) field diaphragm, but also by the limits imposed by the design of the Objective.'

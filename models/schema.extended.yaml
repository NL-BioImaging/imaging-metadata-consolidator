  Arc:
    description: An Arc lamp is a discharge lamp that produces light by an electric arc (also called a voltaic arc), which
      is typically generated between metal electrodes and travels through an inert gas in a glass bulb. The inert gas can
      be Mercury (He), Xenon (Xe), or a mixture of the two. The choice of the gas is important because its nature determines
      the spectral behavior of the lamp. Refer to Type for more informations about this aspect.
    fields:
    - name: Type
      type: string
      required: true
      description: This field records the inert gas vapor contained in the Arc lamp bulb. The nature of the gas determines
        the spectral behavior of the lamp. At low pressure, Hg lamps emit a characteristic line spectrum, which becomes more
        uniform as the lamp heats up. On the other hand, Xe lamps emit light of high luminance, high color temperature, and
        an almost continuous spectrum distributed from the ultraviolet to the infrared.
      constraints:
        enum:
        - Hg
        - Xe
        - HgXe
        - Other
    - name: Name
      type: string
      required: false
      description: A User-defined Name for this component.

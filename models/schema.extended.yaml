  InvertedMicroscopeStand:
    description: This is a Microscope in which the object is observed from beneath the stage.
    fields:
    - name: Name
      type: string
      required: false
      description: A User-defined Name for this component.
    - name: ID
      type: string
      required: true
      description: A Unique Identifier for this component.
      is_identifier: true
    - name: Type
      type: string
      required: true
      description: This field describes the general category to which this Microscope belongs. A Compound Microscope is a
        Microscope in which the primary image is generated by an objective or an objective and a tube-lens, and in which the
        Sample is observed through an eyepiece. A Custom Microscope is specially designed for specialized purposes. An Electrophysiology
        Microscope is a Microscope dedicated to electrophysiological observation and manipulation. A Lightsheet Microscope
        is a Microscope in which in contrast to epifluorescence microscopy only a thin slice (usually a few hundred nanometers
        to a few micrometers) of the sample is illuminated perpendicularly to the direction of observation. A Stereo Microscope
        (also known as Dissecting Microscope) is a low-power, binocular Microscope with long free working distance used for
        dissecting. Generally in this type of Microscope the object is observed by each eye from a slightly different angle,
        thus causing stereoscopic perception.
      constraints:
        enum:
        - Compound
        - Custom made
        - Dissection
        - Electrophysiology
        - Light sheet
        - Stereomicroscope
        - Other
    - name: Origin
      type: string
      required: false
      description: This field describes the origin of this Microscope Stand. Specifically it specifies whether this Microscope
        Stand was purchased from a Commercial vendor and is being used as-is (i.e., Commercial- as is), purchased from a Commercial
        vendor and subsequently Modified for a specialized application (i.e., Commercial- custom-modified) or entirely Custom-built
        from scratch (i.e., Custom-built).
      constraints:
        enum:
        - Commercial-as is
        - Commercial-custom modified
        - Custom-built

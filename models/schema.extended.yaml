      constraints:
        enum:
        - Convex
        - Concave
        - Planar
        - Other
    - name: Geometry
      type: string
      required: false
      description: This field records the geometrical shape of the surface(s) of this Mirror.
      constraints:
        enum:
        - Aspherical
        - Cylindrical
        - Ellipsoidal
        - Hyeprboloidal
        - Paraboloidal
        - Spherical
        - Other
    - name: Diameter

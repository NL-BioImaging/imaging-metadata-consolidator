  PointDetectorSettings:
    description: This element refers to the Point Detector used to acquire this Channel and it holds the Settings that were
      applied to the Point Detector during this Acquisition.
    fields:
    - name: Voltage
      type: float
      required: true
      description: This field refers to the Voltage settings applied to the Photomultiplier Tube (PMT) for the Acquisition
        of this Channel (e.g., voltage = 244). The higher the supplied Voltage, the greater the amplification of the current
        generated by the PMT. While this increases the sensitivity, it also increases the background in the resulting image.
    - name: VoltageUnit
      type: string
      required: false
      constraints:
        enum:
        - YV
        - ZV
        - EV
        - PV
        - TV
        - GV
        - MV
        - kV
        - hV
        - daV
        - V
        - dV
        - cV
        - mV
        - µV
        - nV
        - pV
        - fV
        - aV
        - zV
        - yV
      example: mV
    - name: PhotonCounting
      type: boolean
      required: false
      description: This boolean indicates whether this Photomultiplier Tube was operated in photon-counting mode (True) or
        not (False), during the Acquisition of this Channel.
    - name: ID
      type: string
      required: true
      description: A Unique Identifier for this component.
      is_identifier: true
    - name: EffectiveBitDepth
      type: string
      required: true
      description: If selectable, this field reports the Effective Bit Depth that was used by the Detector's Analog to Digital
        Converter (ADC; also referred to as Digitizer) for the Acquisition of this Channel.
      constraints:
        enum:
        - 8bit
        - 12bit
        - 14bit
        - 16bit
        - 32bit
        - 64bit
    - name: AnalogGain
      type: float
      required: true
      description: 'This field reports the Analog Gain (also known as Inherent Gain or simply as Gain) that was applied during
        the Acquisition of this Image. The Analog Gain is a property Inherent to the Detector and it specifies how many electrons
        correspond to 1 signal unit (photon) detected. Gain is reported in terms of electrons/ADU (analog-to-digital unit).
        A gain of 8 means that the Detector digitizes the light signal so that each ADU corresponds to 8 photoelectrons. NOTE:
        In the case of Point Detectors the value of Analog Gain can be set freely by the user. Conversely, in the case of
        Cameras, it is common for the Gain to be preset by the Manufacturer to minimize noise. In this case, either the Analog
        Gain cannot be changed or the user is given the choice of selecting between a few preset Analog Gains values upon
        Acquisition. Finally, several Cameras might have so-called Automatic Gain Control (AGC or AutoGain) that will automatically
        adjusts so the full range of the Analog-to-Digital Converter (ADC) is used. Unless you can turn off the AGC, the use
        of these Cameras are highly discouraged for quantitative work.'
    - name: AmplificationGain
      type: float
      required: true
      description: 'This field reports the Amplification Gain (i.e., electronic gain as apposed to the inherent Gain) that
        was set during the Acquisition of this Image. Amplification Gain in general measures of the ability of a Detector
        to add energy to the input light signal therefore increasing its power or amplitude. Higher Amplification Gain levels
        amplify the signal and result in greater brightness, contrast and background signal. Examples include: 1) the Electron
        Multiplication (EM) gain (as opposed to the inherent Analog Gain) for an EMCCD camera. 2) The Gain introduced by the
        Micro-Channel Plate in an Intensified CCD or CMOS camera. 3) The amplification of the electron current provided by
        a Photomultiplier Tube, and measured as the ratio of the input photoelectron current emitted by the photocatode and
        the current reaching the anode. 4) The signal amplification provided by an Avalache Photo Diode (APD).'
    - name: Offset
      type: float
      required: false
      description: 'If available, this field reports the actual Offset that was set for this Detector during the Acquisition
        of this Channel. Offset is an electronic baseline added to the output signal generated by the sensor to ensure that
        the resulting signal level always correspond to a positive number of counts. Offset defines the black level setting
        of the image and it should be adjusted so that the lowest signals are near the detection threshold. NOTE: Please note
        that most modern Cameras do not have the possibility of setting the Offset.'
    - name: OffsetMode
      type: string
      required: false
      description: This field describes the way in which the Voltage Offset of the Detector is reported. It typically is expressed
        as an Arbitrary-units number, a Scaled percent (-100 to 100), or a a Voltage.
      constraints:
        enum:
        - Arbitrary units
        - Scaled percentage
        - Voltage
        - Other
    - name: Tier
      type: integer
      required: false
      description: The tier level of this component.

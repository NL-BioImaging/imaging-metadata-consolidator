    - name: Name
      type: string
      required: false
      description: A User-defined Name for this component.
    - name: ID
      type: string
      required: true
      description: A Unique Identifier for this component.
      is_identifier: true
    - name: Mount
      type: string
      required: false
      description: This field records the type of Mount used to connect this detector to the Microscope Stand.
      constraints:
        enum:
        - C-mount
        - D-SLR adapter
        - SLR adapter
        - T-mount
        - Other
      example: C-mount
    - name: MaxBitDepth
      type: string
      required: true
      description: This field records the Maximum Bit Depth provided by the Detector's Analog to Digital Converter (ADC; also
        referred to as Digitizer).
      constraints:
        enum:
        - 8bit
        - 12bit
        - 14bit
        - 16bit
        - 32bit
        - 64bit
    - name: QuantumEfficiency
      type: float
      required: true
      description: This field records the Quantum Efficiency observed at Peak Wavelength, according to the Manufacturer. Quantum
        Efficiency is generally defined as is the ratio of incident photons to converted electrons. Typically expressed as
        a number between 0 and 1.
    - name: ElectronicConversionFactor
      type: float
      required: true
      description: This field records the Electron-Conversion Factor for this Detector, as specified by the Manufacturer.
        The Electron Conversion Factor relates the actual number of electrons generated by the Detector with the digital number
        associated with each Pixel. It is expressed in electrons/Analog-to-Digital-Unit (ADU). Note that ADU can also be referred
        to as Digital Number (DN) or Binary Number. It is sometimes referred to as Digital Gain or, in case of CCD cameras
        as CCD Gain.
    - name: ReadOutNoise
      type: float
      required: true
      description: This field captures the Read-out Noise associated with this Detector, as specified by the Manufacturer.
        Read-out Noise is a constant amount of noise and it includes thermal noise build-up and clock induced charge added
        by the CCD chip, the readout amplifier and surrounding electronics. It is generally expressed in photo-electrons (i.e.,
        e- root-mean-square).
    - name: ReadNoiseUnit
      type: string
      required: false
      constraints:
        enum:
        - A
        - e-/Pixel/sec
        - e- rms
      example: e- rms
    - name: DetectorNoiseModel
      type: string
      required: true
      description: This field records the Noise Model associated with this Detector.
      constraints:
        enum:
        - Gaussian
        - Poisson
        - Other
    - name: DarkCurrentRate
      type: float
      required: true
      description: This field records the Dark Current Rate of this Detector as specified by the Manufacturer. The Dark Current
        Rate is the median current detected in the absence of light. Generally expressed in e-/Pixel/sec.
    - name: DarkCurrentRateUnit
      type: string
      required: false
      constraints:
        enum:
        - A
        - e-/Pixel/sec
        - e- rms
      example: e-/Pixel/sec
    - name: DynamicRange
      type: float
      required: false
      description: This field records the Dynamic Range of this Detector in deciBel (dB).
    - name: DynamicRangeUnit
      type: string
      required: false
      constraints:
        enum:
        - bel
        - decibel (dB)
      example: decibel (dB)
    - name: AmbientOperatingTemperature
      type: float
      required: false
      description: This field records the Ambient Temperature at which this Detector is designed to operate, according to
        the Manufacturer.
    - name: AmbientOperatingTemperatureUnit
      type: string
      required: false

  PhotoMultiplierTube:
    description: A Photomultiplier Tube (PMT) is a photoemissive device in which the absorption of a photon results in the
      emission of an electron and it is used for the detection of very weak signals. These Detectors work by amplifying the
      electrons generated by a photocathode exposed to a photon flux. The higher the supplied voltage (PMTVoltage setting),
      the greater the amplification of the current (PMTGain setting) and thus sensitivity, but also the higher the noise in
      the acquired image. The amplifier offset (PMTOffset setting) defines black level setting of the image. A PMT has no
      inherent spatial information of the image.
    fields:
    - name: CollectionEfficiency
      type: float
      required: true
      description: This field measures the probability that photoelectrons will land on the effective area of the first dynode
        of the photomultiplier stage. While there might be dispersion at the second and later dynodes, this tends to have
        less of an effect on the total collection efficiency as the number of emitted electrons increases greatly.
    - name: Multianode
      type: boolean
      required: true
      description: This field records whether (True) or not (False) this is Photo Multiplier Tube is composed of an array
        of multiple
    - name: MultianodeChannelNr
      type: integer
      required: false
      description: In case this Detector is a Multianode composed of an array of multiple Photomultiplier Tubes, this field
        records the number of Channels it consists of.
    - name: MultianodeArrangement
      type: string
      required: false
      description: In case this Detector is a Multianode composed of an array of multiple Photomultiplier Tubes, this field
        records the arrangement of the individual Photomultiplier Tubes.
      constraints:
        enum:
        - Linear
        - Round
        - Square
        - Other
    - name: HeadOn
      type: boolean
      required: false
      description: This is True if the Photocathode is positioned at either end of the vacuum tube. This is False if the photocathode
        element is located on the side of the vacuum tube (side-on geometry).
    - name: Coating
      type: string
      required: true
      description: This field records the Coating Material used to increase the photoelectric properties of the metallic cathode
        used in this Detector. The coating releases electrons much more readily than the underlying metal, allowing it to
        detect the low-energy photons in infrared radiation. The lens transmits the radiation from the object being viewed
        to a layer of coated glass. The photons strike the metal surface and transfer electrons to its rear side. The freed
        electrons are then collected to produce the final Image.
      constraints:
        enum:
        - Bi-alkali
        - Multi-alkali
        - Gallium arsenide phosphide
        - Gallius arsenide
        - Other
    - name: SignalProcessing
      type: string
      required: false
      description: This field describes the method employed by this device to process the output signal and convert it into
        a measure of incident light intensity. In Photon Counting mode the system is set in a manner in which each photon
        hitting the head of the detector gives either no or 1 discrete pulse. This way by counting the pulses one is sure
        to be counting individual photons. In Analog mode the system is set so the mean value of all signal pulses is used
        as a measure of intensity.
      constraints:
        enum:
        - Analog
        - PhotonCounting
        - Other
    - name: ResponseTime
      type: float
      required: false
      description: This field records the Time required for the Detector to respond to an optical input.
    - name: ResponseTimeUnit
      type: string
      required: false
      constraints:
        enum:
        - Ys
        - Zs
        - Es
        - Ps
        - Ts
        - Gs
        - Ms
        - ks
        - hs
        - das
        - s
        - ds
        - cs
        - ms
        - µs
        - ns
        - ps
        - fs
        - as
        - zs
        - ys
        - min
        - h
        - d
    - name: DeadTime
      type: float
      required: false
      description: This field records the Time required for the Detector to become responsive again after being hit by a photon.
    - name: DeadTimeUnit
      type: string
      required: false
      constraints:

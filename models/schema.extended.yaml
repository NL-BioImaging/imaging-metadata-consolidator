        - bit
        - complex
        - double
        - double-complex
        - float
        - int8
        - int12
        - int14
        - int16
        - int32
        - uint8
        - uint12
        - uint14
        - uint16
        - uint32
        - Other
    - name: Interleaved
      type: boolean
      required: false
      description: 'This field records the order in which the Channels are arranged within the data block: True if Channels
        are stored RGBRGBRGB...; False if Channels are stored RRR...GGG...BBB…'
    - name: SignificantBits
      type: integer
      required: false
      description: This field records the number of bits within the type storing each Pixel value that are significant. e.g.,.
        you can store 12-bit data within a 16-bit type. This does not reduce the storage requirements but can be a useful
        indicator when processing or viewing the Image data.
    - name: BigEndian
      type: boolean
      required: false
      description: This field is True if the pixels data was written in BigEndian order. If this value is present, it should
        match the value used in BinData or TiffData. If it is not, a reader should be used that honors the value used in the
        BinData or TiffData. This value is useful for MetadataOnly files and is to allow for future storage solutions.
    - name: Plane
      type: list
      required: false
      description: Each Image has to have at least one Plane and one Channel
      items: Plane
      owns: true
    - name: Channel
      type: list
      required: false
      description: Each Image has to have at least one Plane and one Channel
      items: Channel
      owns: true
    - name: Tier
      type: integer
      required: false
      description: The tier level of this component.

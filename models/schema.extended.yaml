  PhotoDiode:
    description: This element represents a Photovoltaic Detector. Most photodiodes used in confocal microscopes are Avalanche
      Photodiode (APD) which because of the amplification gain have good sensitivities and less dark current.
    fields:
    - name: Avalanche
      type: boolean
      required: false
      description: This field records whether (True) or not (False) this is an Avalanche Photodiode.
    - name: PINJunction
      type: boolean
      required: false
      description: This field records whether this photodiode is based on a Positive-Intermediate-Negative (PIN) or a Positive-Negative
        (PN) architecture.
    - name: Coating
      type: string
      required: true
      description: This field records the Coating Material used to increase the photoelectric properties of the metallic cathode
        used in this Detector. The coating releases electrons much more readily than the underlying metal, allowing it to
        detect the low-energy photons in infrared radiation. The lens transmits the radiation from the object being viewed
        to a layer of coated glass. The photons strike the metal surface and transfer electrons to its rear side. The freed
        electrons are then collected to produce the final Image.
      constraints:
        enum:
        - Bi-alkali
        - Multi-alkali
        - Gallium arsenide phosphide
        - Gallius arsenide
        - Other
    - name: SignalProcessing
      type: string
      required: false
      description: This field describes the method employed by this device to process the output signal and convert it into
        a measure of incident light intensity. In Photon Counting mode the system is set in a manner in which each photon
        hitting the head of the detector gives either no or 1 discrete pulse. This way by counting the pulses one is sure
        to be counting individual photons. In Analog mode the system is set so the mean value of all signal pulses is used
        as a measure of intensity.
      constraints:
        enum:
        - Analog
        - PhotonCounting
        - Other
    - name: ResponseTime
      type: float
      required: false
      description: This field records the Time required for the Detector to respond to an optical input.
    - name: ResponseTimeUnit
      type: string
      required: false
      constraints:

        - mi
        - ua
        - ly
        - pc
        - pt
        - Pixel
        - reference frame
    - name: RadiusOfCurvature
      type: float
      required: false
      description: The radius of curvature of this Mirror. A spherical lens or Mirror surface has a center of curvature located
        either along or decentered from the system local optical axis. The vertex of the lens surface is located on the local
        optical axis. The distance from the vertex to the center of curvature is the radius of curvature of the surface.
    - name: RadiusOfCurvatureUnit
      type: string
      required: false
      constraints:
        enum:
        - Ym
        - Zm
        - Em
        - Pm
        - Tm

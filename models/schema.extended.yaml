    - name: AngleOfIncidence
      type: float
      required: false
      description: This field records the optimal angle of incidence (AOI) for this Mirror. The AOI is the angle between the
        optical axis of the incident light and the axis normal to the surface of the Mirror. In specular reflection AOI is
        by definition equal to the Angle Of Reflection (AOR).
    - name: AngleOfIncidenceUnit
      type: string
      required: false
      constraints:
        enum:
        - deg
      example: deg
    - name: SubstrateType
      type: string
      required: false
      description: This field records the type of Substrate that is used for this Mirror. It is typically a ground and polished
        piece of optical glass.
    - name: SubstrateMaterial
      type: string
      required: false
      description: This field records the chemical composition or the designation of the substrate of this Mirroring Device.
        The substrate is typically composed of a glass material with low autofluorescence, such as UV-grade fused silica or
        Borofloat.
      constraints:
        enum:
        - alpha-Barium Borate
        - Barium Crown (BAK/N-BAK)
        - Barium Flint (BAF/N-BAF)
        - Barium Heavy Flint (BASF/N-BASF)
        - Barium Light Flint (BALF/N-BALF)
        - Borofloat

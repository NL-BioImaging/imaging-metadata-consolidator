      description: This refers to an available Prism, which is part of this Optical Assembly.
      items: Prism
    - name: Description
      type: string
      required: false
      description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
        a simple multi-line comment) describing this component.
    - name: Tier
      type: integer
      required: false
      description: The tier level of this component.
  ShutterSettings:
    description: This element holds the Setting applied to a Shutter used in the Light Path during the acquisition of this
      Channel as well as a reference (the ID attribute) to the Shutter in question.
    fields:
    - name: ID
      type: string
      required: true
      description: This is the Unique Identifier of the device used in this case.
      is_identifier: true
    - name: OpenDuringZMovement
      type: boolean
      required: true
      description: This field captures whether this Shutter was open (True) or closed (False) during Z-movement between successive
        Z-planes in this Image.
    - name: ApertureDiameter
      type: float
      required: false
      description: This field records the actual physical Aperture Diameter that was used for this Shutter during the Acquisition
        of this Channel.
    - name: ApertureDiameterUnit
      type: string
      required: false
      constraints:
        enum:
        - Ym
        - Zm
        - Em
        - Pm
        - Tm
        - Gm
        - Mm
        - km
        - hm
        - dam
        - m
        - dm
        - cm
        - mm
        - µm
        - nm
        - pm
        - fm
        - am
        - zm
        - ym
        - Å
        - thou
        - li
        - in
        - ft
        - yd
        - mi
        - ua
        - ly
        - pc
        - pt
        - Pixel
        - reference frame
    - name: Mode
      type: string
      required: false
      description: This field records the operation mode that was applied to this Shutter during the Acquisition of this Channel.
        The Fast mode provides the quickest open and close action sequence for which the shutter is capable. The Soft intensity
        without affecting wavelength is accommodated by a Neutral Density shutter mode (for more details see https://www.microscopyu.com/applications/live-cell-imaging/the-automatic-microscope).
      constraints:
        enum:
        - Fast
        - Neutral density
        - Slow
        - Other
    - name: Tier
      type: integer
      required: false
      description: The tier level of this component.
  Channel:
    description: Each Image has to have at least one Plane and one Channel. The Channel element stores information about how
      the each Image Channel was acquired. The total number of Channel elements for a given Image must equal to SizeC.
    fields:
    - name: Name
      type: string
      required: true
      description: A Name for this Channel that is suitable for presentation to the user.
    - name: ID
      type: string
      required: true
      description: A unique identifier for this Channel.
      is_identifier: true
    - name: IlluminationType
      type: string
      required: true
      description: This field describes the Light Microscopy Illumination method performed in this case. Allowable terms were
        obtained from the Biological Imaging Methods Ontology (Fbbi; https://www.ebi.ac.uk/ols/ontologies/fbbi) Light Microscopy
        term (http://purl.obolibrary.org/obo/FBbi_00000345).
      constraints:
        enum:
        - 4DPlus
        - Coherent Anti-Stokes Raman Scattering (CARS)
        - Confocal_Fluorescence_array-raster-scan
        - Confocal_Fluorescence_single-spot-raster-scan
        - Confocal_Fluorescence_slit-raster-scan
        - Confocal_Fluorescence_spinning disk
        - Confocal_Fluorescence_swept-field
        - Confocal_Fluorescence_Two-photon laser scanning microscopy
        - Confocal_Fluorescence_Multi-photon laser scanning microscopy
        - Fluorescence Correlation Spectroscopy (FCS)
        - Light Sheet Fluorescence Microscopy (LSFM)
        - Near Field Scanning Optical Microscopy (NSOM)
        - Optical coherence tomography (OCT)
        - Second-Harmonic Imaging Microscopy (SHIM)
        - Spectral Imaging
        - 'SPIM (Selective or Single Plane Illumination Microscopy) '
        - Super-Resolution_GSD (Ground State Depletion Scanning)
        - Super-Resolution_DOPI (Defocussed Oorientation and Position Imaging)
        - Super-Resolution_FIONA (Fluorescence Imaging With One Nanometer Accuracy)
        - Super-Resolution_PAINT (Point Accumulation for Imaging In Nanoscale Topography)
        - Super-Resolution_PALM (Photoactivation Localization Microscopy)
        - Super-Resolution_STORM (Stochastic Optical Reconstruction Microscopy)
        - Super-Resolution_STED (Stimulated Emission Depletion)
        - Super-Resolution_SIM (Structured Illumination Microscopy)
        - TIRF (Total Total Internal Reflection Fluorescence)
        - Transmitted_Bright-field
        - Transmitted_Dark-field
        - Transmitted_Dark-field_Evanescent wave scattering
        - Transmitted_Differential Intensity Contrast (DIC; Nomarski)
        - Transmitted_Hoffman modulation
        - Transmitted_Phase contrast (Zernicke)
        - Transmitted_Polarization
        - Transmitted_Oblique illumination
        - Transmitted_Varel contrast
        - Wide-field_Fluorescence
        - Widefield_Fluorescence_FLIM (Fluorescence Lifetime Imaging)
        - Widefield_Fluorescence_FLIP (Fluorescence Loss in Photobleaching)
        - Widefield_Fluorescence_FRAP (Fluorescence Recovery After Photobleaching)
        - Widefield_Fluorescence_FRET (Förster Resonance Energy Transfer)
        - Widefield_Fluorescence_SPIM (Selective or Single Plane Illumination Microscopy)
        - Widefield_Fluorescence_TIRF (Total Internal Reflection Fluorescence)
        - Other
    - name: IlluminationTypeTermAcession
      type: string
      required: false
      description: This field records the Accession ID for the term used to describe the Illumination Type. A sub-classes
        of Light Microscopy term (http://purl.obolibrary.org/obo/FBbi_00000345) is recommended.
    - name: ContrastMethod
      type: string
      required: true
      description: This field describes the technique used to achieve contrast for this Channel.
      constraints:
        enum:
        - Brightfield
        - Darkfield
        - Differential Intensity Contrast (DIC)
        - Fluorescence
        - HoffmanModulation
        - ObliqueIllumination
        - PhaseContrast
        - PolarizedLight
        - VarelConrast
        - Other
    - name: Color
      type: integer
      required: false
      description: 'This field records the Color used to render this Channel - encoded as RGBA. The default value is -1 corresponding
        #FFFFFFFF, so solid white (it is a signed 32 bit value).'
      example: '-1'
    - name: SamplesPerPixel
      type: integer
      required: false
      description: This field is prevalently used for RGB Images and records the number of samples the detector takes to form
        each pixel value. [units:none]
    - name: Description
      type: string
      required: false
      description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
        a simple multi-line comment) describing this component.
    - name: Fluorophore
      type: list
      required: false
      description: This element describes the Fluorophore whose Emission is used to produce this Channel
      items: Fluorophore
      owns: true
    - name: LightPath
      type: entity
      required: false
      description: This element holds a description of the Light Path associated with the Acquisition of this Channel.
      items: LightPath
      owns: true
    - name: Tier
      type: integer
      required: false
      description: The tier level of this component.
  Pump:
    description: In case the primary Laser is Pumped, this element describe a secondary Laser, positioned upstream of the
      primary Laser and used to pump it.
    fields:
    - name: ID
      type: string
      required: true
      description: A Unique Identifier for this component.
      is_identifier: true
  ExcitationFilter:
    description: An optical Filter is a device designed to selectively control the Wavelengths, color temperature, vibration
      direction, and/or intensity of the radiation which it transmits or reflects. This element refers to an Excitation Filter
      whose purpose is to selectively attenuate the Light that is utilized to Excite the Sample depending on Wavelength. This
      element can be associated with an optional Filter Holder.
    fields:
    - name: Name
      type: string
      required: false
      description: A User-defined Name for this component.
    - name: ID
      type: string
      required: true
      description: A Unique Identifier for this component.
      is_identifier: true
    - name: Type
      type: string
      required: true
      description: This field captures the Type of Filter used in this case.
      constraints:
        enum:
        - BandPass
        - BandStop
        - LongPass
        - MultiPass
        - Notch
        - ShortPass
        - Other
    - name: CoatingMethod
      type: string
      required: true
      description: This field records the type of Coating used in this case. An optical coating is one or more thin layers
        of material deposited on an optical component such as a Lens, Filter or Mirror, which alters the way in which the
        optic reflects and transmits light.
      constraints:
        enum:
        - HardCoated
        - SoftCoated
        - Other
    - name: LightPathLocation
      type: string
      required: true
      description: 'This field records the location of this component in the Microscope Light Path. The most common positions
        are: Infinity Space, Camera Port or Illumination Port.'
      constraints:
        enum:
        - Infinity space
        - Camera Port
        - Illumination port
        - Other
    - name: FilterHolderPosition
      type: integer
      required: false
      description: This field records the position of this element in a Filter Holder of any kind, such as a Filter Slider,
        Turret or Wheel.
    - name: Technology
      type: string
      required: false
      description: This field records Filtering technology utilized by this optical element. The main types of Filter technology
        used in fluorescence analysis are Absorption (aka colored) glass, Metallic-coating, Polymer-Based, or Thin-film interference-coating.
      constraints:
        enum:
        - Absorption Colored Glass
        - Metallic-coating
        - Polymer-Based
        - Thin-film interference-coating
        - Other
    - name: AttenuationMethod
      type: string
      required: true
      description: This field records the mean by which this optical element achieves out-of-band transmission attenuation.
      constraints:
        enum:
        - Absorption
        - Reflection
        - Refraction
        - Other
    - name: AttenuationCoefficient
      type: float
      required: false
      description: This field records the Attenuation Coefficient (AC) of this optical element. The AC (aka blocking coefficient)
        is a material property that characterizes the degree to which light is being blocked (i.e., scattered or absorbed)
        by it. AC is used as a measure of the out-of-band blocking of an optical Lens, Filter, Dichroic mirror over an extended
        range of the spectrum. AC is often reported in units of optical density (OD), whereas OD= -log10(T), and T=Transmittance
        (0≤T≤1).
    - name: Diameter
      type: float
      required: false
      description: This field describes the Diameter of this optical element.
    - name: DiameterUnit
      type: string
      required: false
      constraints:
        enum:
        - Ym
        - Zm
        - Em
        - Pm
        - Tm
        - Gm
        - Mm
        - km
        - hm
        - dam
        - m
        - dm
        - cm
        - mm
        - µm
        - nm
        - pm
        - fm
        - am
        - zm
        - ym
        - Å
        - thou
        - li
        - in
        - ft
        - yd
        - mi
        - ua
        - ly
        - pc
        - pt
        - Pixel
        - reference frame
    - name: Thickness
      type: float
      required: false
      description: This field describes the Thickness of this optical element.
    - name: ThicknessUnit
      type: string
      required: false
      constraints:
        enum:
        - Ym
        - Zm
        - Em
        - Pm
        - Tm
        - Gm
        - Mm
        - km
        - hm
        - dam
        - m
        - dm
        - cm
        - mm
        - µm
        - nm
        - pm
        - fm
        - am
        - zm
        - ym
        - Å
        - thou
        - li
        - in
        - ft
        - yd
        - mi
        - ua
        - ly
        - pc
        - pt
        - Pixel
        - reference frame
    - name: AngleOfIncidence
      type: float
      required: false
      description: This field records the optimal angle of incidence (AOI) for this Filter. The AOI is the angle between the
        optical axis of the incident light and the axis normal to the surface of the mirror. In specular reflection AOI is
        by definition equal to the Angle Of Reflection (AOR).
    - name: AngleOfIncidenceUnit
      type: string
      required: false
      constraints:
        enum:
        - deg
        - µrad
        - mrad
        - rad
        - gon
    - name: Polarization
      type: string
      required: false
      description: This field records the Polarization effect of this optical element. Any thin-film interference coating
        that is used at non-normal AOI will cause some amount of Polarization, the precise effect varying greatly with Wavelength
        and with the particular coating design.
      constraints:
        enum:
        - Circular
        - Elliptical
        - Planar
        - Other
    - name: Manufacturer
      type: string
      required: true
      description: This field refers to the company, research group or individual who built or manufactured this hardware
        component.
    - name: Model
      type: string
      required: true
      description: This field refers to the Model name or any other designation the Manufacturer uses for this component.
    - name: CatalogNumber
      type: string
      required: true
      description: This field records the Catalog, Part or Serial Number used by the Manufacturer to uniquely identify this
        component.
    - name: LotNumber
      type: string
      required: false
      description: The Lot Number used by the Manufacturer to refer to a specific production batch or lot for this component.
    - name: SpecsFile
      type: string
      required: false
      description: This element refers to a PDF file that contains the specifications for this hardware component as provided
        by the Manufacturer.
    - name: TransmittanceRange
      type: list
      required: true
      description: This element records the Range (also known as Band) of Wavelengths that are transmitted by this optical
        component. It also records the maximum amount of light transmitted. Multiple of these elements can be used.
      items: ExcitationFilter_TransmittanceRange
      owns: true
    - name: Description
      type: string
      required: false
      description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
        a simple multi-line comment) describing this component.
    - name: TransmittanceProfileFile
      type: list
      required: false
      description: This element represents a file in .csv or other suitable formats containing the Transmittance profile of
        this optical component.
      items: TransmittanceProfileFile
      owns: true
    - name: Tier
      type: integer
      required: false
      description: The tier level of this component.
  ExcitationFilter_TransmittanceRange:
    description: This element records the Range (also known as Band) of Wavelengths that are transmitted by this optical component.
      It also records the maximum amount of light transmitted. Multiple of these elements can be used.
    fields:
    - name: Wavelength
      type: float
      required: true
      description: This field records the key Wavelength] that characterizes this Transmittance Range (also known as Transmission
        band). In the case of Bandpass, Bandstop, Multipass or Notch Filters, Wavelength often refers to the Central Wavelength
        of each of the transmission band(s); alternatively, in case of a Longpass or a Shortpass Filters, Wavelength refers
        to the CutOn Wavelength (i.e., below which there is less than 50% transmittance) or the CutOff Wavelengths (i.e.,
        above which there is less than 50% transmittance) respectively. In the case of Dichroics, Wavelength most commonly
        refers to the Edge Wavelength which might be either the CutOn or the CutOff Wavelength depending on individual cases.
    - name: FWHMBandwidth
      type: float
      required: true
      description: This field records the width of this Transmittance Range (also known as Transmission band). Specifically,
        the Full Width at Half Maximum (FWHM) represents the bandwidth of the Wavelength spectrum curve measured between those
        points whose transmission amplitude is 50% of the maximum. In case bandwidth is not available, such as in the case
        of a LongPass, Notch or ShortPass configuration, please enter 000.
    - name: WavelengthUnit
      type: string
      required: false
      constraints:
        enum:
        - Ym
        - Zm
        - Em
        - Pm
        - Tm
        - Gm
        - Mm
        - km
        - hm
        - dam
        - m
        - dm
        - cm
        - mm
        - µm
        - nm
        - pm
        - fm
        - am
        - zm
        - ym
        - Å
        - thou
        - li
        - in
        - ft
        - yd
        - mi
        - ua
        - ly
        - pc
        - pt
        - Pixel
        - reference frame
      example: nm
    - name: Transmittance
      type: float
      required: false
      description: This field records the maximum amount of light this optical component is capable of transmitting in this
        Wavelength Range, at the peak Wavelength. It is represented as a fractional value from 0.0 to 1.0.
  GenericDetector:
    description: This element is used to represent a Generic Detector as a collection of Key/Value pairs, which are stored
      in a Map. One of the other detector elements should always be used in preference to this if possible.
    fields:
    - name: Name
      type: string
      required: false
      description: A User-defined Name for this component.
    - name: ID
      type: string
      required: true
      description: A Unique Identifier for this component.
      is_identifier: true
    - name: Mount
      type: string
      required: false
      description: This field records the type of Mount used to connect this detector to the Microscope Stand.
      constraints:
        enum:
        - C-mount
        - D-SLR adapter
        - SLR adapter
        - T-mount
        - Other
      example: C-mount
    - name: MaxBitDepth
      type: string
      required: true
      description: This field records the Maximum Bit Depth provided by the Detector's Analog to Digital Converter (ADC; also
        referred to as Digitizer).
      constraints:
        enum:
        - 8bit
        - 12bit
        - 14bit
        - 16bit
        - 32bit
        - 64bit
    - name: QuantumEfficiency
      type: float
      required: true
      description: This field records the Quantum Efficiency observed at Peak Wavelength, according to the Manufacturer. Quantum
        Efficiency is generally defined as is the ratio of incident photons to converted electrons. Typically expressed as
        a number between 0 and 1.
    - name: ElectronicConversionFactor
      type: float
      required: true
      description: This field records the Electron-Conversion Factor for this Detector, as specified by the Manufacturer.
        The Electron Conversion Factor relates the actual number of electrons generated by the Detector with the digital number
        associated with each Pixel. It is expressed in electrons/Analog-to-Digital-Unit (ADU). Note that ADU can also be referred
        to as Digital Number (DN) or Binary Number. It is sometimes referred to as Digital Gain or, in case of CCD cameras
        as CCD Gain.
    - name: ReadOutNoise
      type: float
      required: true
      description: This field captures the Read-out Noise associated with this Detector, as specified by the Manufacturer.
        Read-out Noise is a constant amount of noise and it includes thermal noise build-up and clock induced charge added
        by the CCD chip, the readout amplifier and surrounding electronics. It is generally expressed in photo-electrons (i.e.,
        e- root-mean-square).
    - name: ReadNoiseUnit
      type: string
      required: false
      constraints:
        enum:
        - A
        - e-/Pixel/sec
        - e- rms
      example: e- rms
    - name: DetectorNoiseModel
      type: string
      required: true
      description: This field records the Noise Model associated with this Detector.
      constraints:
        enum:
        - Gaussian
        - Poisson
        - Other
    - name: DarkCurrentRate
      type: float
      required: true
      description: This field records the Dark Current Rate of this Detector as specified by the Manufacturer. The Dark Current
        Rate is the median current detected in the absence of light. Generally expressed in e-/Pixel/sec.
    - name: DarkCurrentRateUnit
      type: string
      required: false
      constraints:
        enum:
        - A
        - e-/Pixel/sec
        - e- rms
      example: e-/Pixel/sec
    - name: DynamicRange
      type: float
      required: false
      description: This field records the Dynamic Range of this Detector in deciBel (dB).
    - name: DynamicRangeUnit
      type: string
      required: false
      constraints:
        enum:
        - bel
        - decibel (dB)
      example: decibel (dB)
    - name: AmbientOperatingTemperature
      type: float
      required: false
      description: This field records the Ambient Temperature at which this Detector is designed to operate, according to
        the Manufacturer.
    - name: AmbientOperatingTemperatureUnit
      type: string
      required: false
      constraints:
        enum:
        - °C
        - °F
        - K
        - °R
      example: °C
    - name: AmbientOperatingHumidity
      type: float
      required: false
      description: This field records the Ambient Humidity at which this detector is designed to operate, according to the
        Manufacturer.
    - name: Manufacturer
      type: string
      required: true
      description: This field refers to the company, research group or individual who built or manufactured this hardware
        component.
    - name: Model
      type: string
      required: true
      description: This field refers to the Model name or any other designation the Manufacturer uses for this component.
    - name: CatalogNumber
      type: string
      required: true
      description: This field records the Catalog, Part or Serial Number used by the Manufacturer to uniquely identify this
        component.
    - name: LotNumber
      type: string
      required: false
      description: The Lot Number used by the Manufacturer to refer to a specific production batch or lot for this component.
    - name: SpecsFile
      type: string
      required: false
      description: This element refers to a PDF file that contains the specifications for this hardware component as provided
        by the Manufacturer.
    - name: RelayLens
      type: entity
      required: false
      description: This is a reference to a lens positioned at the mount connecting this detector to the microscope body.
      items: RelayLens
    - name: Description
      type: string
      required: false
      description: This is an empty element that refers to an Annotation (typically a Comment Annotation that consists of
        a simple multi-line comment) describing this component.
    - name: WavelengthRange
      type: list
      required: false
      description: This element records the Range of Wavelengths this device is designed for, according to the Manufacturer.
        Multiple of this element may be used.
      items: GenericDetector_WavelengthRange
      owns: true
    - name: Tier
      type: integer
      required: false
      description: The tier level of this component.
